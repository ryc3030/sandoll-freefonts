name: 무료폰트 목록 갱신

on:
  schedule:
    - cron: "17 0 * * 1"   # 매주 월요일 09:17 (KST)
  workflow_dispatch:
  push:                    # 스킬·데이터 원본을 고치면 ZIP과 기호 데이터를 바로 다시 만든다
    branches: [main]
    paths:
      - "skill/**"
      - "data/fontfiles.json"
      - "data/agency-fonts.json"
      - "data/design-tokens.json"
      - "scripts/build_skill_zip.py"
      - "docs/USER-GUIDE-ko.pdf"
      - "scripts/glyph_coverage.py"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "beautifulsoup4==4.*" "fonttools==4.*" "lxml==5.*" "python-pptx==1.*"
      - name: 산돌구름 수집
        id: sandoll
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/scrape.py
      - name: Google Fonts 수집
        id: google
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/google_fonts.py
      - name: 폰트별 기호 지원 계산
        id: glyph
        continue-on-error: true
        run: python scripts/glyph_coverage.py
      - name: 스킬 회귀 시험(분석)
        id: tests
        continue-on-error: true
        run: python tests/run_tests.py
      - name: 설치 ZIP 만들기
        run: python scripts/build_skill_zip.py
      - name: 바뀐 내용이 있으면 커밋
        run: |
          if git diff --quiet -- data/ dist/; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ dist/
            git commit -m "data: 무료폰트 목록·설치 ZIP 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi
      - name: 실패한 단계 알림
        if: steps.sandoll.outcome == 'failure' || steps.google.outcome == 'failure' || steps.glyph.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "::error::실패한 단계 — 산돌:${{ steps.sandoll.outcome }} Google:${{ steps.google.outcome }} 기호:${{ steps.glyph.outcome }} 시험:${{ steps.tests.outcome }}"
          exit 1
