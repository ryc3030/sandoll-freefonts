name: 무료폰트 목록 갱신

on:
  schedule:
    - cron: "17 0 * * 1"   # 매주 월요일 09:17 (KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 fonttools
      - run: python scripts/scrape.py
      - run: python scripts/google_fonts.py
      - run: python scripts/glyph_coverage.py
      - run: python scripts/build_skill_zip.py
      - name: 바뀐 내용이 있으면 커밋
        run: |
          if git diff --quiet -- data/fonts.json data/google-fonts.json data/glyph-coverage.json dist/; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fonts.json data/google-fonts.json data/glyph-coverage.json dist/
          git commit -m "data: 무료폰트 목록 갱신 ($(date -u +%Y-%m-%d))"
          git push
